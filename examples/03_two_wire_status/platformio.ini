; Minimal PlatformIO configuration for this example sketch.
; The sketch also opens directly in the Arduino IDE (esp8266 core).
; Upload: `pio run -t upload` in this folder (or the Arduino IDE upload button)

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
src_dir = .
monitor_speed = 115200
